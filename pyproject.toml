[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-extractor-mcp-server"
version = "0.3.3"
description = "Flexible Key-Value Extraction MCP Server using LLM and pydantic-ai"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "KunihiroS", email = "kunihiros@gmail.com" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Framework :: FastAPI"
]
# Upper bounds keep a fresh `uvx` / `pipx run` resolution reproducible.
# Verified set (2026-09-27): fastmcp 4.0.10 / pydantic-ai 2.51.0 / pydantic 2.13.5 / spacy 3.8.16.
# spaCy is held to 3.8.x because the auto-downloaded language models are built per minor version.
dependencies = [
    "fastmcp>=4.0,<5",
    "pydantic-ai>=2.0,<3",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "toml>=0.10,<0.11",
    "spacy>=3.8,<3.9",
    "langdetect>=1.0.9,<2",
    "click>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["kv_extractor_mcp_server"]
package-dir = {"" = "src"}

[project.scripts]
kv-extractor-mcp-server = "kv_extractor_mcp_server.server:initialize_and_run_server"